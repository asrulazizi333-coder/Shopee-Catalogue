<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Viral 10 Page</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        
        body { 
            background: #f0f0f0; 
            max-width: 450px; /* Mengecilkan sedikit lebar keseluruhan */
            margin: 0 auto; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header { 
            background: white; padding: 10px; position: sticky; top: 0; z-index: 100; 
            box-shadow: 0 1px 5px rgba(0,0,0,0.1); 
        }
        
        h1 { font-size: 1rem; text-align: center; margin-bottom: 8px; color: #ee4d2d; }
        #searchInput { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; }

        /* GRID: 2 Barang Semuka, Saiz Lebih Kecil */
        .container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; /* Jarak antara kotak lebih rapat */
            padding: 6px; 
            flex-grow: 1;
        }
        
        .kad { 
            background: white; border-radius: 6px; overflow: hidden; 
            display: flex; flex-direction: column; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-size: 0.75rem;
        }
        
        .kad img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
        
        .info { padding: 6px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .info h2 { font-size: 0.75rem; height: 2rem; overflow: hidden; margin-bottom: 4px; line-height: 1.2; color: #333; }
        .harga { color: #ee4d2d; font-weight: bold; font-size: 0.85rem; margin-bottom: 6px; }
        
        .butang { 
            background: #ee4d2d; color: white; text-decoration: none; text-align: center; 
            padding: 5px; border-radius: 4px; font-weight: bold; font-size: 0.7rem;
        }

        /* Pagination */
        .pagination { 
            display: flex; justify-content: center; align-items: center; 
            gap: 10px; padding: 15px; background: white; border-top: 1px solid #eee;
        }
        .btn-page { padding: 6px 12px; border-radius: 4px; border: 1px solid #ee4d2d; background: white; color: #ee4d2d; font-size: 0.8rem; }
        .btn-page:disabled { border-color: #ccc; color: #ccc; }
        #pageNumber { font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>🛍️ Katalog Viral Azizi</h1>
    <input type="text" id="searchInput" onkeyup="tapis()" placeholder="Cari barang...">
</header>

<div class="container" id="produkList">

    <div class="kad" data-page="1">
        <img src="URL_GAMBAR">
        <div class="info">
            <h2 class="nama-produk">Produk 1 - Page 1</h2>
            <p class="harga">RM 10.00</p>
            <a href="LINK" class="butang">Beli</a>
        </div>
    </div>
    <div class="kad" data-page="2">
        <img src="URL_GAMBAR">
        <div class="info">
            <h2 class="nama-produk">Produk 11 - Page 2</h2>
            <p class="harga">RM 20.00</p>
            <a href="LINK" class="butang">Beli</a>
        </div>
    </div>

    </div>

<div class="pagination">
    <button class="btn-page" id="btnPrev" onclick="tukarHalaman(-1)">Sebelum</button>
    <span id="pageNumber">Halaman 1</span>
    <button class="btn-page" id="btnNext" onclick="tukarHalaman(1)">Seterusnya</button>
</div>

<script>
    let pageSekarang = 1;

    function tunjuk() {
        let kad = document.getElementsByClassName('kad');
        let cari = document.getElementById('searchInput').value.toLowerCase();
        let adaSeterusnya = false;

        for (let i = 0; i < kad.length; i++) {
            let nama = kad[i].querySelector('.nama-produk').innerText.toLowerCase();
            let p = kad[i].getAttribute('data-page');

            if (cari !== "") {
                kad[i].style.display = nama.includes(cari) ? "" : "none";
                document.querySelector('.pagination').style.display = "none";
            } else {
                document.querySelector('.pagination').style.display = "flex";
                kad[i].style.display = (p == pageSekarang) ? "" : "none";
            }
            
            if (parseInt(p) > pageSekarang) adaSeterusnya = true;
        }

        document.getElementById('pageNumber').innerText = "Halaman " + pageSekarang;
        document.getElementById('btnPrev').disabled = (pageSekarang === 1);
        document.getElementById('btnNext').disabled = !adaSeterusnya;
    }

    function tukarHalaman(n) {
        pageSekarang += n;
        window.scrollTo(0,0);
        tunjuk();
    }

    function tapis() { tunjuk(); }
    tunjuk();
</script>

</body>
</html>
